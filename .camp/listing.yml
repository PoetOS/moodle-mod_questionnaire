name: Questionnaire
summary: Build questionnaires and surveys from a variety of question types and report on the responses.
description: |
  The questionnaire module allows you to construct questionnaires (surveys)
  from a variety of question types, for the purpose of gathering data from
  users. It was originally based on phpESP, an open source survey tool.
